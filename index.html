</style></head><body><header class="top"><h1>◈ Global Invest Pro <span style="font-size:13px;font-weight:400">V1.6</span></h1><small>全球五大股市 · 智能投资决策工作台 · 本地数据优先</small></header><div class="layout"><nav id="nav"></nav><main id="app"></main></div><script>
const markets=[['US','🇺🇸 美股','USD'],['HK','🇭🇰 港股','HKD'],['UK','🇬🇧 英股','GBP'],['KR','🇰🇷 韩股','KRW'],['CN','🇨🇳 A股','CNY']];const modules=[['dashboard','🏠 总览'],['quotes','🌐 全球行情'],['screen','🔎 智能选股'],['valuation','🧮 企业估值'],['options','📈 期权策略'],['portfolio','💼 投资组合'],['holdings','📌 持仓股跟踪'],['calendar','🗓️ 财经日历'],['news','📰 重大新闻'],['research','🧠 AI研究'],['weekly','📋 持仓周报']];let page='dashboard',market='US';const sample=[['US','AAPL','Apple',240,3.1,31,29,12,0.5],['US','MSFT','Microsoft',430,1.8,35,36,16,0.7],['US','NVDA','NVIDIA',135,4.5,48,65,52,0.03],['HK','0700.HK','腾讯控股',520,1.6,24,20,18,0.8],['HK','0005.HK','汇丰控股',105,-0.7,12,9,8,5.5],['UK','SHEL.L','Shell',27.5,0.9,11,8,6,4.2],['UK','AZN.L','AstraZeneca',120,-0.3,26,14,11,2.1],['KR','005930.KS','三星电子',72000,2.2,17,19,12,2.4],['KR','000660.KS','SK海力士',210000,3.6,23,37,15,0.9],['CN','600519.SS','贵州茅台',1550,0.8,24,14,9,3.1],['CN','002475.SZ','立讯精密',42,2.1,22,25,14,0.8],['CN','300750.SZ','宁德时代',260,-1.2,25,28,18,1.4]]; // entirely illustrative, not market prices
const $=id=>document.getElementById(id),get=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}},put=(key,val)=>{localStorage.setItem(key,JSON.stringify(val))},fmt=(n,d=2)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d}),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),currency=m=>markets.find(x=>x[0]===m)?.[2]||'USD',button=(txt,fn,cls='')=>`<button class="btn ${cls}" onclick="${fn}">${txt}</button>`,field=(name,id,val,type='number')=>`<div class="field"><label>${name}</label><input id="${id}" type="${type}" value="${esc(val)}"></div>`,select=(id,items)=>`<select id="${id}">${items.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select>`;
function shell(){ $('nav').innerHTML=modules.map(([k,n])=>`<button class="${page===k?'active':''}" onclick="page='${k}';render()">${n}</button>`).join('');}function notice(){return `<div class="notice">⚠️ 行情列表为<strong>示例数据</strong>，不代表当前或历史真实市场报价。所有本地录入数据仅保存在当前设备浏览器中。免费行情连接需要后端部署或合法数据接口。</div>`}function render(){shell();const f={dashboard,quotes,screen,valuation,options,portfolio,holdings,calendar,news,research,weekly}[page];$('app').innerHTML=f();if(page==='calendar')setTimeout(initAutoCalendar,0);if(page==='news')setTimeout(initMobileNews,0);}
function dashboard(){const positions=get('positions',[]),events=get('events',[]),newsItems=get('news',[]),notes=get('notes',[]),watch=get('watch',[]);return `<h2>投资总览</h2>${notice()}<div class="grid"><div class="card"><div class="muted">覆盖市场</div><div class="big">5</div><div class="muted">美 / 港 / 英 / 韩 / A股</div></div><div class="card"><div class="muted">持仓记录</div><div class="big">${positions.length}</div><div class="muted">本地记录</div></div><div class="card"><div class="muted">自选股票</div><div class="big">${watch.length}</div></div><div class="card"><div class="muted">研究笔记</div><div class="big">${notes.length}</div></div></div><div class="card"><h3>市场快捷入口</h3><div class="row">${markets.map(m=>button(m[1],`market='${m[0]}';page='quotes';render()`,'alt')).join('')}</div></div><div class="card"><h3>本周重要事件与新闻</h3><p class="muted">财经日历：${events.length} 条手动记录；新闻：${newsItems.length} 条手动记录。尚未接入自动财经资讯源。</p><div class="row">${button('查看本周日历',"page='calendar';render()",'alt')}${button('查看重大新闻',"page='news';render()",'alt')}</div></div><div class="card"><h3>工作流</h3><p>① 查看行情 → ② 筛选股票 → ③ 估值 → ④ 期权测算 → ⑤ 组合记录 → ⑥ 投资研究</p><p class="muted">本版计算器和本地数据管理可离线使用；研究模块为结构化研究记录，不会伪装成已接入的AI模型。</p></div>`}
function quoteRows(arr){let watch=get('watch',[]);return `<div class="scroll"><table><thead><tr><th>市场</th><th>代码</th><th>名称</th><th>示例价</th><th>示例涨跌</th><th>PE</th><th>ROE %</th><th>营收增速 %</th><th>股息率 %</th><th>操作</th></tr></thead><tbody>${arr.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${fmt(r[3])} ${currency(r[0])}</td><td class="${r[4]>=0?'good':'bad'}">${r[4]>0?'+':''}${r[4]}%</td><td>${r[5]}</td><td>${r[6]}</td><td>${r[7]}</td><td>${r[8]}</td><td><button class="smallbtn" onclick="toggleWatch('${r[1]}')">${watch.includes(r[1])?'★':'☆'} 自选</button></td></tr>`).join('')}</tbody></table></div>`}function toggleWatch(code){let w=get('watch',[]);w=w.includes(code)?w.filter(x=>x!==code):[...w,code];put('watch',w);render()}
function quotes(){let extra=get('quotes',[]);return `<h2>全球行情与自选</h2>${notice()}<div class="tabs">${[['ALL','全部'],...markets.map(x=>[x[0],x[1]])].map(([k,v])=>`<button class="${market===k?'active':''}" onclick="market='${k}';render()">${v}</button>`).join('')}</div><div class="card"><h3>市场观察列表（演示）</h3>${quoteRows(sample.filter(r=>market==='ALL'||r[0]===market))}</div><div class="card"><h3>我的自选</h3>${quoteRows(sample.filter(r=>get('watch',[]).includes(r[1])))}</div><div class="card"><h3>手动行情记录（独立于示例数据）</h3><div class="row">${field('股票代码','qcode','AAPL','text')}${field('最新已知价格','qprice',0)}${field('价格日期/时间','qdate',new Date().toISOString().slice(0,10),'date')}</div>${button('保存行情记录','saveQuote()','green')}<div id="qresult"></div>${extra.length?`<div class="scroll"><table><tr><th>代码</th><th>价格</th><th>记录日期</th><th>操作</th></tr>${extra.map((q,i)=>`<tr><td>${esc(q.code)}</td><td>${fmt(q.price)}</td><td>${esc(q.date)}</td><td><button class="smallbtn" onclick="deleteQuote(${i})">删除</button></td></tr>`).join('')}</table></div>`:''}</div>`}function saveQuote(){let code=$('qcode').value.trim().toUpperCase(),price=+$('qprice').value,date=$('qdate').value;if(!code||!(price>0)||!date)return alert('请输入有效代码、正数价格和日期');let a=get('quotes',[]);a.unshift({code,price,date});put('quotes',a);render()}function deleteQuote(i){let a=get('quotes',[]);a.splice(i,1);put('quotes',a);render()}
function screen(){return `<h2>智能选股</h2>${notice()}<div class="card"><h3>多因子筛选器</h3><div class="row"><div class="field"><label>市场</label>${select('smarket',[['ALL','全部市场'],...markets.map(x=>[x[0],x[1]])])}</div>${field('最大市盈率 PE','spe',30)}${field('最低 ROE %','sroe',12)}${field('最低营收增速 %','sgrowth',10)}${field('最低股息率 %','sdiv',0)}</div>${button('执行筛选','runScreen()')}<div id="sresult" class="result">筛选使用演示样本，适合测试筛选规则；真实全市场筛选需接入完整股票数据库。</div></div>`}function runScreen(){let a=sample.filter(r=>($('smarket').value==='ALL'||r[0]===$('smarket').value)&&r[5]<=+$('spe').value&&r[6]>=+$('sroe').value&&r[7]>=+$('sgrowth').value&&r[8]>=+$('sdiv').value);$('sresult').innerHTML=`匹配 ${a.length} 只示例股票：${a.map(r=>r[1]+' '+r[2]).join('、')||'无'}`}
function valuation(){return `<h2>企业估值中心</h2><div class="card"><h3>自由现金流折现 DCF（股权口径）</h3><p class="muted">以股权自由现金流 FCFE 为输入，使用股权折现率，得到股权价值。金额单位必须一致；增长率不得大于折现率。</p><div class="row">${field('当前每年 FCFE（百万）','vfcf',1000)}${field('前5年增长率 %','vg',10)}${field('股权折现率 %','vr',12)}${field('永续增长率 %','vt',3)}${field('总股数（百万股）','vshares',1000)}${field('当前股价','vprice',15)}</div>${button('计算内在价值','calcDCF()')}<div class="result" id="vresult">输入假设后计算。FCFE不适合所有企业，银行等金融企业建议采用股利折现或PB/ROE方法。</div></div><div class="card"><h3>相对估值 PE 法</h3><div class="row">${field('每股收益 EPS','veps',2)}${field('合理市盈率 PE','vpe',18)}${field('现价','vnow',30)}</div>${button('计算PE估值','calcPE()','alt')}<div class="result" id="peresult"></div></div>`}function calcDCF(){let f=+$('vfcf').value,g=+$('vg').value/100,r=+$('vr').value/100,t=+$('vt').value/100,n=+$('vshares').value,p=+$('vprice').value;if(!(f>0&&n>0&&r>t&&r>0&&g>-1&&t>-1))return $('vresult').textContent='参数无效：需满足 FCFE>0、股数>0、折现率>永续增长率。';let pv=0,cf=f;for(let i=1;i<=5;i++){cf*=1+g;pv+=cf/(1+r)**i}let tv=cf*(1+t)/(r-t)/(1+r)**5,per=(pv+tv)/n,margin=(per-p)/per*100;$('vresult').textContent=`前5年现金流现值：${fmt(pv)} 百万\n终值现值：${fmt(tv)} 百万\n股权总价值：${fmt(pv+tv)} 百万\n每股内在价值：${fmt(per)}\n当前价格：${fmt(p)}\n相对内在价值的安全边际：${fmt(margin)}%\n注意：模型结果高度依赖增长率和折现率假设。`}function calcPE(){let eps=+$('veps').value,pe=+$('vpe').value,p=+$('vnow').value;if(!(pe>0&&p>0))return $('peresult').textContent='请输入有效参数';let v=eps*pe;$('peresult').textContent=`合理价格：${fmt(v)}；相对估值差：${fmt((v/p-1)*100)}%`}
function options(){return `<h2>期权策略测算</h2><div class="card"><h3>到期盈亏模拟器</h3><p class="muted">支持买/卖看涨与看跌期权，多腿组合。输入每股权利金，计算到期盈亏（不含手续费、行权、汇率和提前指派）。默认每张合约乘数100，可修改。</p><div class="row">${field('到期标的价格','ospot',100)}${field('每张合约乘数','omult',100)}${field('价格区间下限','omin',60)}${field('价格区间上限','omax',140)}</div><div id="legs"></div><div class="row">${button('增加一腿','addLeg()','alt')}${button('计算盈亏','calcOptions()')}</div><div id="oresult" class="result">计算结果将显示在此处。</div><canvas id="payoff" height="200"></canvas></div>`}let legsState=[{type:'call',side:'buy',strike:100,premium:6,qty:1},{type:'call',side:'sell',strike:110,premium:2,qty:1}];function legHTML(){return legsState.map((l,i)=>`<div class="row" style="border-bottom:1px solid #e9eef5;padding:8px 0"><div class="field"><label>方向</label><select onchange="setLeg(${i},'side',this.value)"><option value="buy" ${l.side==='buy'?'selected':''}>买入</option><option value="sell" ${l.side==='sell'?'selected':''}>卖出</option></select></div><div class="field"><label>类型</label><select onchange="setLeg(${i},'type',this.value)"><option value="call" ${l.type==='call'?'selected':''}>Call</option><option value="put" ${l.type==='put'?'selected':''}>Put</option></select></div>${[['strike','行权价'],['premium','权利金/股'],['qty','合约张数']].map(([k,n])=>`<div class="field"><label>${n}</label><input type="number" min="0" step="any" value="${l[k]}" onchange="setLeg(${i},'${k}',this.value)"></div>`).join('')}<button class="smallbtn" onclick="removeLeg(${i})">删除</button></div>`).join('')}function setLeg(i,k,v){legsState[i][k]=['type','side'].includes(k)?v:+v}function addLeg(){legsState.push({type:'put',side:'buy',strike:90,premium:3,qty:1});$('legs').innerHTML=legHTML()}function removeLeg(i){legsState.splice(i,1);$('legs').innerHTML=legHTML()}function payoff(s,m){return legsState.reduce((sum,l)=>{let intrinsic=l.type==='call'?Math.max(0,s-l.strike):Math.max(0,l.strike-s);return sum+(l.side==='buy'?1:-1)*(intrinsic-l.premium)*l.qty*m},0)}function calcOptions(){let s=+$('ospot').value,m=+$('omult').value,lo=+$('omin').value,hi=+$('omax').value;if(!(m>0&&lo>=0&&hi>lo&&legsState.length&&legsState.every(l=>l.strike>=0&&l.premium>=0&&l.qty>0)))return $('oresult').textContent='请输入有效价格区间、合约乘数和期权腿参数';let ys=Array.from({length:101},(_,i)=>payoff(lo+(hi-lo)*i/100,m)),mn=Math.min(...ys),mx=Math.max(...ys);$('oresult').textContent=`到期价 ${fmt(s)} 时盈亏：${fmt(payoff(s,m))}\n所选价格区间内最低盈亏：${fmt(mn)}；最高盈亏：${fmt(mx)}\n注意：区间内极值不一定是策略理论最大盈亏；裸卖期权可能有无限风险。`;let c=$('payoff'),ctx=c.getContext('2d'),w=c.width=c.clientWidth*devicePixelRatio,h=c.height=200*devicePixelRatio;ctx.clearRect(0,0,w,h);let pad=35*devicePixelRatio,low=Math.min(mn,0),high=Math.max(mx,0),range=high-low||1;ctx.strokeStyle='#c4d5e3';ctx.beginPath();let zy=h-pad-(0-low)/range*(h-2*pad);ctx.moveTo(pad,zy);ctx.lineTo(w-pad,zy);ctx.stroke();ctx.strokeStyle='#1265b5';ctx.lineWidth=2*devicePixelRatio;ctx.beginPath();ys.forEach((y,i)=>{let x=pad+(w-2*pad)*i/100,py=h-pad-(y-low)/range*(h-2*pad);i?ctx.lineTo(x,py):ctx.moveTo(x,py)});ctx.stroke();ctx.fillStyle='#536f85';ctx.font=`${11*devicePixelRatio}px sans-serif`;ctx.fillText(fmt(lo),pad,h-8*devicePixelRatio);ctx.fillText(fmt(hi),w-pad-35*devicePixelRatio,h-8*devicePixelRatio);ctx.fillText('0',5*devicePixelRatio,zy)}
function portfolio(){let a=get('positions',[]);let sums={};a.forEach(p=>{let cur=currency(p.market);(sums[cur]??={cost:0,value:0});sums[cur].cost+=p.qty*p.cost;sums[cur].value+=p.qty*p.last});return `<h2>投资组合管理</h2><div class="notice">不同币种分别汇总，不使用虚构汇率直接相加。持仓及现价均为手动录入，未连接券商。</div><div class="card"><h3>新增持仓</h3><div class="row"><div class="field"><label>市场</label>${select('pmarket',markets.map(x=>[x[0],x[1]]))}</div>${field('股票代码','pcode','AAPL','text')}${field('股数','pqty',10)}${field('成本价','pcost',100)}${field('最新价（手动）','plast',110)}</div>${button('保存持仓','addPosition()','green')}</div><div class="grid">${Object.entries(sums).map(([k,v])=>`<div class="card"><div class="muted">${k} 组合市值</div><div class="big">${fmt(v.value)}</div><div class="${v.value>=v.cost?'good':'bad'}">盈亏 ${fmt(v.value-v.cost)} (${v.cost?fmt((v.value/v.cost-1)*100):0}%)</div></div>`).join('')}</div><div class="card"><h3>持仓明细</h3><div class="scroll"><table><tr><th>市场</th><th>代码</th><th>数量</th><th>成本</th><th>现价</th><th>盈亏</th><th>操作</th></tr>${a.map((p,i)=>`<tr><td>${p.market}</td><td>${esc(p.code)}</td><td>${fmt(p.qty)}</td><td>${fmt(p.cost)}</td><td>${fmt(p.last)}</td><td class="${p.last>=p.cost?'good':'bad'}">${fmt((p.last-p.cost)*p.qty)} ${currency(p.market)}</td><td><button class="smallbtn" onclick="updatePosition(${i})">改现价</button> <button class="smallbtn" onclick="removePosition(${i})">删除</button></td></tr>`).join('')}</table></div></div>`}function addPosition(){let a=get('positions',[]),p={market:$('pmarket').value,code:$('pcode').value.trim().toUpperCase(),qty:+$('pqty').value,cost:+$('pcost').value,last:+$('plast').value};if(!p.code||!(p.qty>0)||p.cost<0||p.last<0)return alert('请填写有效持仓数据');a.push(p);put('positions',a);render()}function updatePosition(i){let a=get('positions',[]),s=prompt('请输入最新价',a[i].last);if(s===null)return;let n=Number(s);if(!Number.isFinite(n)||n<0)return alert('价格无效');a[i].last=n;put('positions',a);render()}function removePosition(i){if(!confirm('确定删除该持仓？'))return;let a=get('positions',[]);a.splice(i,1);put('positions',a);render()}

// Holdings use the same position store as portfolio: no duplicated or conflicting account balances.

function openHolding(i){let p=get('positions',[])[i];if(!p)return;let key=p.market+':'+p.code, f=get('focus',{})[key]||{};$('holdingDetail').innerHTML=`<h3>${esc(p.code)} · 持仓跟踪</h3><p class="muted">${esc(p.market)} / ${currency(p.market)} · 持仓${fmt(p.qty)}股 · 手动价格${fmt(p.last)}</p><label>投资逻辑 / 买入理由</label><textarea id="hthesis" rows="3">${esc(f.thesis||'')}</textarea><label>重点观察：客户、订单、财报与估值</label><textarea id="hcatalysts" rows="3">${esc(f.catalysts||'')}</textarea><label>主要风险 / 退出条件</label><textarea id="hrisks" rows="3">${esc(f.risks||'')}</textarea><div class="row"><button class="btn green" onclick="saveHolding(${i})">保存跟踪档案</button><button class="btn alt" onclick="page='research';render()">进入研究笔记</button></div>`}

function calendar(){let a=get('events',[]).slice().sort((x,y)=>(x.date+' '+x.time).localeCompare(y.date+' '+y.time));return `<h2>财经日历 · 手机独立联网 V1.7</h2><div class="notice">打开页面将尝试联网更新。自动事件来自服务端已配置的公开日历源，若未配置或网络不可用将明确显示。所有时间转换为北京时间；没有事件不代表市场没有公告。手机可直接请求允许跨域访问的 HTTPS 日历接口，无需 Python 服务。数据源需自行配置；无源时不显示虚构事件。</div><div class="card"><h3>自动财经日历</h3><p class="muted">默认尝试 XOOMAR 美国宏观经济日历（第三方；可能受跨域限制）；五市场企业财报仍需补充授权数据源。日期和时间以原发布机构为准。</p><div class="row"><button class="btn green" onclick="loadDefaultCalendar()">获取美国宏观日历</button><button class="btn" onclick="loadCalendarFeed()">立即联网刷新</button><button class="btn alt" onclick="clearAutoEvents()">清除自动缓存</button></div><div class="field"><label>手机直连数据源 HTTPS 地址（JSON 或 ICS；须允许跨域访问）</label><input id="mobileFeedUrl" type="url" placeholder="https://example.org/calendar.json" oninput="saveMobileFeedUrl(this.value)"></div><div class="row"><button class="btn alt" onclick="document.getElementById('icsFile').click()">导入 ICS 日历文件</button><input type="file" id="icsFile" accept=".ics,text/calendar" hidden onchange="importICSFile(this.files[0])"></div><div id="feedcal" class="result">正在准备连接…</div><div id="feedstatus" class="muted"></div></div><div class="card"><h3>持仓事件关联</h3><div id="eventmatches" class="result">自动日历更新后将匹配股票代码与公司名称；宏观事件按市场关联，仅为提示，不代表因果关系。</div></div><div class="card"><h3>本地手动事件</h3>${eventTable(a,true)}</div><div class="card"><h3>新增手动事件</h3><div class="row"><div class="field"><label>事件类型</label>${select('etype',[['财报','财报'],['宏观数据','宏观数据'],['央行/利率','央行/利率'],['其他','其他']])}</div>${field('事件名称','ename','美国CPI公布','text')}${field('发布日期','edate',new Date().toISOString().slice(0,10),'date')}${field('当地时间（24小时制）','etime','08:30','time')}</div><div class="row"><div class="field"><label>时区（IANA）</label>${select('etz',[['America/New_York','美东'],['Asia/Hong_Kong','香港'],['Europe/London','英国'],['Asia/Seoul','韩国'],['Asia/Shanghai','北京时间'],['UTC','UTC']])}</div><div class="field"><label>关联市场</label>${select('emarket',[['ALL','全球'],...markets.map(x function safeLink(u){try{let x=new URL(u);return ['https:','http:'].includes(x.protocol)?`<a href="${esc(x.href)}" target="_blank" rel="noopener noreferrer">来源</a>`:'—'}catch{return '—'}}
function addEvent(){let name=$('ename').value.trim(),date=$('edate').value,time=$('etime').value,url=$('eurl').value.trim();if(!name||!date||!time)return alert('请输入事件名称、日期和时间');if(url&&!safeLink(url).startsWith('<a'))return alert('来源必须为 http/https 链接');let a=get('events',[]);a.push({id:String(Date.now())+Math.random().toString(36).slice(2),name,date,time,url,tz:$('etz').value,type:$('etype').value,market:$('emarket').value});put('events',a);render()}

function news(){let a=get('news',[]).slice().sort((x,y)=>y.date.localeCompare(x.date));return `<h2>重大股市新闻中心</h2><div class="notice">新闻聚合采用 GDELT 第三方新闻索引，打开页面尝试联网更新；标题不等于事实核实，可能存在漏报、重复或跨域限制。任何未附可靠来源的内容都应标为待核实。</div><div class="card"><h3>手机直连新闻聚合</h3><p class="muted">GDELT 新闻索引（第三方），仅显示新闻标题、来源、时间和原文链接；并非交易所正式公告。</p><div class="row"><div class="field"><label>选择市场</label>${select('feedmarket',[['ALL','全球'],...markets.map(x=>[x[0],x[1]])])}</div><button class="btn" onclick="loadNewsFeed()">刷新新闻</button></div><div id="feednews" class="result">尚未刷新</div></div><div class="card"><h3>录入新闻及投资影响</h3><div class="row">${field('新闻标题','ntitle','','text')}${field('发布日期','ndate',new Date().toISOString().slice(0,10),'date')}<div class="field"><label>影响市场</label>${select('nmarket',[['ALL','全球'],...markets.map(x=>[x[0],x[1]])])}</div></div><div class="row">${field('来源链接','nurl','','url')}<div class="field"><label>是否重大</label>${select('nimportant',[['yes','重大 / 重点关注'],['no','一般新闻']])}</div><div class="field"><label>核实状态</label>${select('nverified',[['pending','待核实'],['checked','已人工核实']])}</div></div><label>可能影响的持仓及分析（主观判断）</label><textarea id="nimpact" rows="3" placeholder="如：影响哪些持仓、可能的利好利空、尚需核实的证据"></textarea>${button('保存新闻','addNews()','green')}</div><div class="card"><h3>新闻记录（${a.length}）</h3>${a.map(x=>`<div style="border-bottom:1px solid #e7eef4;padding:12px 0"><b>${x.important?'🔴 ':''}${esc(x.title)}</b><p class="muted">${esc(x.date)} · ${esc(x.market)} · ${x.verified?'人工标记已核实':'待核实'} · ${safeLink(x.url)}</p><p>${esc(x.impact)}</p><button class="smallbtn" onclick="deleteNews('${esc(x.id)}')">删除</button></div>`).join('')||'<p class="muted">暂无新闻记录。</p>'}</div>`}
function addNews(){let title=$('ntitle').value.trim(),date=$('ndate').value,url=$('nurl').value.trim();if(!title||!date)return alert('请输入标题和日期');if(url&&!safeLink(url).startsWith('<a'))return alert('请输入有效的 http/https 链接');let a=get('news',[]);a.unshift({id:String(Date.now())+Math.random().toString(36).slice(2),title,date,url,market:$('nmarket').value,important:$('nimportant').value==='yes',verified:$('nverified').value==='checked',impact:$('nimpact').value});put('news',a);render()}

function research(){let notes=get('notes',[]);return `<h2>AI研究工作区</h2><div class="notice">本版提供可用的研究模板、记录与导出；AI自动生成和实时新闻检索尚未接入。请勿将手动记录误认为自动核实的研究报告。</div><div class="card"><h3>建立投资研究档案</h3><div class="row">${field('研究标的','rcode','AAPL','text')}<div class="field"><label>研究主题</label>${select('rtopic',[['财务质量','财务质量'],['竞争优势','竞争优势'],['客户与订单','客户与订单'],['估值与安全边际','估值与安全边际'],['风险与催化剂','风险与催化剂']])}</div></div><label>核心事实与数据来源</label><textarea id="rfacts" rows="3" placeholder="记录财报、公告、订单、客户信息及来源日期"></textarea><label>投资判断与待核实问题</label><textarea id="rview" rows="3" placeholder="明确区分事实、推测与风险"></textarea><div class="row">${button('保存研究笔记','saveNote()','green')}${button('导出全部数据 JSON','exportData()','alt')}${button('导入备份 JSON','importData()','alt')}<input type="file" id="importfile" accept="application/json" style="display:none" onchange="readBackup(this)"></div></div><div class="card"><h3>研究档案（${notes.length}）</h3>${notes.map((n,i)=>`<div style="padding:12px;border-bottom:1px solid #e8eef4"><b>${esc(n.code)} · ${esc(n.topic)}</b> <span class="muted">${esc(n.date)}</span><p><b>事实：</b>${esc(n.facts)}</p><p><b>判断：</b>${esc(n.view)}</p><button class="smallbtn" onclick="deleteNote(${i})">删除</button></div>`).join('')||'<p class="muted">暂无记录</p>'}</div>`}function saveNote(){let a=get('notes',[]),code=$('rcode').value.trim().toUpperCase(),facts=$('rfacts').value.trim(),view=$('rview').value.trim();if(!code||!facts)return alert('请输入标的及事实记录');a.unshift({code,topic:$('rtopic').value,facts,view,date:new Date().toISOString().slice(0,10)});put('notes',a);render()}function deleteNote(i){let a=get('notes',[]);a.splice(i,1);put('notes',a);render()}function exportData(){let data={version:2,positions:get('positions',[]),notes:get('notes',[]),watch:get('watch',[]),quotes:get('quotes',[]),focus:get('focus',{}),events:get('events',[]),news:get('news',[])};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='global-invest-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(){$('importfile').click()}function readBackup(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(![1,2].includes(x.version)||!['positions','notes','watch','quotes'].every(k=>Array.isArray(x[k]))|| (x.version===2&&(!Array.isArray(x.events)||!Array.isArray(x.news)||typeof x.focus!=='object'||x.focus===null)))throw Error('格式不正确');if(!confirm('导入将覆盖当前设备的本地数据，确定继续？'))return;['positions','notes','watch','quotes'].forEach(k=>put(k,x[k]));put('focus',x.focus||{});put('events',x.events||[]);put('news',x.news||[]);render()}catch(e){alert('导入失败：'+e.message)}};r.readAsText(f)}

// V1.3: deterministic evidence-based report. No remote AI model is invoked.
function isoLocal(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function nextWeekRange(){let d=new Date();d.setHours(12,0,0,0);let wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd+7);let end=new Date(d);end.setDate(end.getDate()+7);return [isoLocal(d),isoLocal(end)]}
function matchesPosition(item,p){let t=[item.name,item.title,item.impact].filter(Boolean).join(' ').toUpperCase();return t.includes(p.code.toUpperCase()) || (item.market===p.market && item.type==='宏观数据') || (item.market==='ALL' && item.type==='央行/利率')}
function buildWeeklyReport(){let [start,end]=nextWeekRange(),positions=get('positions',[]),events=get('events',[]).filter(x=>x.date>=start&&x.date<end).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)),news=get('news',[]).filter(x=>x.date>=isoLocal(new Date(Date.now()-7*86400000))).sort((a,b)=>b.date.localeCompare(a.date)),focus=get('focus',{}),lines=[];
lines.push('全球五大股市｜下周开盘前持仓风险简报（规则生成，非AI模型）','生成：'+new Date().toLocaleString(),'关注周：'+start+' 至 '+end+'（不含结束日）','数据来源：本机手动录入的持仓、事件、新闻；未自动核实。');
lines.push('\n【下周事件】');if(!events.length)lines.push('暂无已录入事件；不代表实际没有财报或宏观数据。');events.forEach(e=>lines.push(`${e.date} ${e.time} ${e.tz} [${e.market}/${e.type}] ${e.name} ${e.url||'无来源链接'}`));
lines.push('\n【逐只持仓】');if(!positions.length)lines.push('尚未录入持仓。');
positions.forEach(p=>{let key=p.market+':'+p.code,f=focus[key]||{},linkedEvents=events.filter(e=>matchesPosition(e,p)),linkedNews=news.filter(n=>matchesPosition(n,p)),pnl=(p.last-p.cost)*p.qty,pct=p.cost>0?(p.last/p.cost-1)*100:null;lines.push(`\n${key}｜数量 ${p.qty}｜手动成本 ${p.cost}｜手动现价 ${p.last} ${currency(p.market)}｜浮盈亏 ${fmt(pnl)} ${currency(p.market)} (${pct===null?'未知':fmt(pct)+'%'})`);lines.push('投资逻辑：'+(f.thesis||'未填写'),'观察重点：'+(f.catalysts||'未填写'),'风险及退出条件：'+(f.risks||'未填写'));lines.push('关联事件：'+(linkedEvents.map(e=>`${e.date} ${e.name}`).join('；')||'未在本地事件中找到代码或市场匹配'));lines.push('关联新闻：'+(linkedNews.map(n=>`${n.date} ${n.title} [${n.verified?'人工标记核实':'待核实'}]`).join('；')||'未在本地新闻中找到代码匹配'));let checks=[];if(!f.thesis)checks.push('补录买入逻辑');if(!f.risks)checks.push('补录退出条件');if(linkedEvents.length)checks.push('核对事件官方时间及影响');if(linkedNews.length)checks.push('核对新闻原始出处');if(pct!==null&&pct<=-8)checks.push('浮亏超过8%，检查原有风控规则是否适用');lines.push('待办：'+(checks.join('；')||'复核财报、价格更新时间与风险敞口'));});
lines.push('\n【组合检查】');for(let m of markets){let ps=positions.filter(p=>p.market===m[0]),sum=ps.reduce((a,p)=>a+p.qty*p.last,0);if(!sum)continue;let max=Math.max(...ps.map(p=>p.qty*p.last));lines.push(`${m[1]}：${ps.length}笔，市值 ${fmt(sum)} ${m[2]}；最大单笔占该市场市值 ${fmt(max/sum*100)}%（不跨币种相加）`)}
lines.push('\n【最近7天本地重大新闻】');let major=news.filter(n=>n.important);lines.push(...(major.length?major.map(n=>`${n.date} [${n.market}] ${n.title} ${n.url||''}`):['暂无已录入重大新闻。']));lines.push('\n重要：报告不构成买卖建议。所有行情均为手动输入，新闻、事件不保证完整；规则匹配可能漏报或误报。');return lines.join('\n')}

function parseICSDate(v,tz){let raw=v.replace(/Z$/,'');if(!/^\d{8}(T\d{6})?$/.test(raw))return null;let iso=raw.slice(0,4)+'-'+raw.slice(4,6)+'-'+raw.slice(6,8);if(!raw.includes('T'))return iso+'T00:00:00Z';let hh=raw.slice(9,11),mm=raw.slice(11,13),ss=raw.slice(13,15);if(v.endsWith('Z'))return iso+'T'+hh+':'+mm+':'+ss+'Z';if(!tz)throw Error('ICS 日期没有时区，已拒绝猜测');const utc=Date.UTC(+raw.slice(0,4),+raw.slice(4,6)-1,+raw.slice(6,8),+hh,+mm,+ss);let guess=utc;for(let i=0;i<3;i++){let parts=new Intl.DateTimeFormat('en-GB',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date(guess));let obj=Object.fromEntries(parts.map(x=>[x.type,x.value]));let local=Date.UTC(+obj.year,+obj.month-1,+obj.day,+obj.hour,+obj.minute,+obj.second);guess+=utc-local}return new Date(guess).toISOString()}
function chinaParts(iso){let f=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(iso));let o=Object.fromEntries(f.map(x=>[x.type,x.value]));return {date:o.year+'-'+o.month+'-'+o.day,time:o.hour+':'+o.minute}}
function parseMobileICS(txt){let lines=txt.replace(/\r\n[ \t]/g,'').split(/\r?\n/),items=[],ev=null;for(let line of lines){if(line==='BEGIN:VEVENT'){ev={};continue}if(line==='END:VEVENT'&&ev){let dt=ev.dt;if(dt){try{let iso=parseICSDate(dt.value,dt.tz);let bt=chinaParts(iso);items.push({id:ev.uid||'ics-'+items.length,name:ev.summary||'未命名事件',type:'其他',market:'ALL',date:bt.date,time:bt.time,tz:'Asia/Shanghai',url:ev.url||'',symbols:[],source:'ICS订阅'})}catch(e){}}ev=null;continue}if(!ev)continue;let i=line.indexOf(':');if(i<0)continue;let key=line.slice(0,i),val=line.slice(i+1);if(key.startsWith('DTSTART'))ev.dt={value:val,tz:(key.match(/TZID=([^;:]+)/)||[])[1]};else if(key==='SUMMARY')ev.summary=val.replace(/\\,/g,',').replace(/\\n/g,' ');else if(key==='UID')ev.uid=val;else if(key==='URL')ev.url=val}return items}
function normalizeMobileJSON(d){let raw=Array.isArray(d)?d:d.items;if(!Array.isArray(raw))throw Error('JSON 必须是事件数组或含 items 数组');return raw.map((e,i)=>{if(!e.name||!e.date)throw Error('第 '+(i+1)+' 条缺少 name/date');let date=e.date,time=e.time||'00:00';if(e.datetime){let t=chinaParts(e.datetime);date=t.date;time=t.time}if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^\d{2}:\d{2}$/.test(time))throw Error('日期格式错误');return {id:e.id||'json-'+i,name:String(e.name),date,time,type:e.type||'其他',market:e.market||'ALL',url:e.url||'',symbols:e.symbols||[],tz:'Asia/Shanghai',source:e.source||'自定义JSON'}})}
async function importICSFile(file){if(!file)return;try{let items=parseMobileICS(await file.text());if(!items.length)throw Error('未解析到带明确时区的有效事件');put('autoCalendar',{items,sources:['手机导入 ICS 文件'],warnings:['本地文件导入，不会自动更新']});put('autoCalendarAt',new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}));showAutoCalendar()}catch(e){alert('导入失败：'+e.message)}}

// V1.7 mobile-only feeds: never embed secrets; failed fetches do not fabricate data.
const V17_CAL_URL='https://xoomar.com/api/markets/calendar?importance=high';
const V17_NEWS_QUERY={ALL:'(stock market OR central bank OR earnings)',US:'(US stocks OR Nasdaq OR Federal Reserve)',HK:'(Hong Kong stocks OR Hang Seng)',UK:'(FTSE OR London Stock Exchange OR Bank of England)',KR:'(KOSPI OR South Korea stocks)',CN:'(China A shares OR Shanghai stock exchange)'};
async function v17FetchJSON(url){
 const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),13000);
 try{const r=await fetch(url,{cache:'no-store',signal:ctrl.signal,headers:{Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}
}
function v17CalendarNormalize(d){
 const rows=Array.isArray(d)?d:(d.data||d.items||d.events||[]);
 if(!Array.isArray(rows))throw Error('数据源结构不兼容');
 const out=[];
 for(let i=0;i<rows.length;i++){
  const e=rows[i],name=String(e.eventName||e.name||e.title||'').trim(),stamp=e.scheduledAt||e.datetime||e.timestamp||e.dateTime;
  if(!name||!stamp||!/[zZ]$|[+-]\d\d:\d\d$/.test(String(stamp)))continue;
  const dt=new Date(stamp);if(!Number.isFinite(dt.getTime()))continue;
  const b=chinaParts(dt.toISOString());
  const link=e.sourceUrl||e.source_url||e.url||'https://xoomar.com/markets/api/calendar';
  out.push({id:'xoomar-'+i+'-'+dt.getTime(),name,date:b.date,time:b.time,tz:'Asia/Shanghai',type:'宏观数据',market:'US',url:link,symbols:[],source:'XOOMAR（第三方）'});
 }
 return out;
}
async function loadDefaultCalendar(){
 const el=$('feedcal');if(!el)return;el.textContent='正在连接美国宏观日历数据源…';
 try{
  const data=await v17FetchJSON(V17_CAL_URL),now=Date.now(),until=now+14*86400000;
  const items=v17CalendarNormalize(data).filter(e=>{const t=Date.parse(e.date+'T'+e.time+':00+08:00');return t>=now-86400000&&t<=until}).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  if(!items.length)throw Error('未来14天没有可解析事件；不能据此判断无重要数据');
  put('autoCalendar',{items,sources:['XOOMAR 美国宏观日历'],warnings:['只覆盖该来源支持的美国宏观事件；不包含五市场完整财报日历','数据为第三方聚合，交易前核实官方公告']});
  put('autoCalendarAt',new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}));
  put('v17CalFetchAt',new Date().toISOString());showAutoCalendar();
 }catch(e){showAutoCalendar();$('feedcal')?.insertAdjacentHTML('afterbegin','<p class="bad">自动日历获取失败：'+esc(e.message)+'。可能是网络、接口限制或浏览器跨域限制；旧缓存不代表最新数据。</p>')}
}

async function loadNewsFeed(){
 const el=$('feednews');if(!el)return;el.textContent='正在连接 GDELT 新闻索引…';
 const m=$('feedmarket')?.value||'ALL';
 const url='https://api.gdeltproject.org/api/v2/doc/doc?query='+encodeURIComponent(V17_NEWS_QUERY[m]||V17_NEWS_QUERY.ALL)+'&mode=ArtList&format=json&maxrecords=30&sort=datedesc&timespan=3d';
 try{
  const d=await v17FetchJSON(url),rows=d.articles;
  if(!Array.isArray(rows))throw Error('新闻源返回格式不兼容');
  const items=rows.filter(x=>x.title&&/^https:\/\//.test(x.url||'')).map(x=>({title:String(x.title),url:x.url,published:x.seendate||'',source:x.domain||'',market:m})).slice(0,30);
  put('v17News_'+m,{items,at:new Date().toISOString()});v17RenderNews(items,m,false);
 }catch(e){
  const old=get('v17News_'+m,null);if(old?.items?.length){v17RenderNews(old.items,m,true);el.insertAdjacentHTML('afterbegin','<p class="bad">本次联网失败：'+esc(e.message)+'，以下为历史缓存（'+esc(old.at)+'）。</p>')}
  else el.textContent='新闻获取失败：'+e.message+'。可能是跨域、频率限制或网络问题；请稍后重试。';
 }
}
function v17RenderNews(items,m,stale){

 el.innerHTML='<p class="muted">'+(stale?'历史缓存':'本次联网获取')+' · '+esc(m)+' · '+items.length+' 条 · 未经逐条核实</p>'+items.map(x=>'<div style="padding:10px 0;border-bottom:1px solid #ddd"><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.title)+'</a><div class="muted">'+esc(x.published)+' · '+esc(x.source)+'</div></div>').join('');
}
